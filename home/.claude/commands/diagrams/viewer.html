<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture diagrams</title>

<style>
  :root {
    --ink:        #10141c;
    --ink-raised: #171d28;
    --ink-deep:   #0b0e14;
    --rule:       #26303f;
    --canvas:     #f4f6f9;
    --grid:       #dde4ee;
    --accent:     #6f63ff;
    --fg:         #e6eaf2;
    --fg-dim:     #8a94a6;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--ink);
    color: var(--fg);
    font-family: var(--sans);
    overflow: hidden;
  }

  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  /* ---------- top bar ---------- */

  .topbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 14px;
    padding: 12px 16px;
    background: var(--ink-raised);
    border-bottom: 1px solid var(--rule);
  }

  .mark {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  .subtitle {
    font-size: 12px;
    color: var(--fg-dim);
    flex: 1 1 60px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 7px 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: #fff; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #8377ff; border-color: #8377ff; }

  /* ---------- diagram menu ---------- */

  .menu { position: relative; flex-shrink: 0; }

  .menu-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 190px;
    text-align: left;
  }
  .menu-btn .caret { margin-left: auto; color: var(--fg-dim); font-size: 9px; }

  .menu-list {
    position: absolute;
    z-index: 20;
    top: calc(100% + 6px);
    left: 0;
    min-width: 300px;
    max-width: 420px;
    max-height: 60vh;
    overflow-y: auto;
    margin: 0;
    padding: 4px;
    list-style: none;
    background: var(--ink-raised);
    border: 1px solid var(--rule);
    border-radius: 4px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    display: none;
  }
  .menu-list.is-open { display: block; }

  .menu-item {
    display: block;
    width: 100%;
    padding: 9px 11px;
    text-align: left;
    background: none;
    border: 0;
    border-radius: 3px;
    color: var(--fg);
    cursor: pointer;
  }
  .menu-item:hover { background: #1f2735; }
  .menu-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .menu-item.is-current { background: #1f2735; box-shadow: inset 2px 0 0 var(--accent); }

  .menu-item-title { font-size: 13px; font-weight: 600; }
  .menu-item-desc { font-size: 12px; color: var(--fg-dim); margin-top: 2px; line-height: 1.4; }

  /* ---------- stage ---------- */

  .stage {
    position: relative;
    overflow: hidden;
    background-color: var(--canvas);
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    cursor: grab;
  }
  .stage:active { cursor: grabbing; }
  .stage.dropping { box-shadow: inset 0 0 0 3px var(--accent); }
  .stage svg { display: block; width: 100%; height: 100%; }

  .stage g.node.is-selected rect,
  .stage g.node.is-selected polygon,
  .stage g.node.is-selected circle,
  .stage g.node.is-selected path {
    stroke: var(--accent) !important;
    stroke-width: 2.5px !important;
  }

  /* ---------- viewport controls ---------- */

  .controls {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
  }

  .ctl {
    width: 38px; height: 34px;
    border: 0;
    background: var(--ink-raised);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .ctl:hover { background: var(--accent); color: #fff; }
  .ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- inspector ---------- */

  .inspector {
    position: absolute;
    left: 16px;
    bottom: 16px;
    max-width: 340px;
    padding: 14px 16px;
    background: var(--ink-raised);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--accent);
    border-radius: 4px;
    display: none;
  }
  .inspector.is-open { display: block; }

  .inspector-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 6px;
  }
  .inspector-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .inspector-body { font-size: 13px; line-height: 1.5; color: #b9c2d1; margin: 0 0 10px; }
  .inspector-path {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  .inspector-path:hover { text-decoration: underline; }

  /* ---------- status bar ---------- */

  .statusbar {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 9px 16px;
    background: var(--ink-raised);
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-dim);
    overflow-x: auto;
    white-space: nowrap;
  }
  .statusbar b { font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: #5c6579; }
  .readout { color: var(--fg); }
  .hint { margin-left: auto; }
  kbd {
    font-family: var(--mono);
    background: var(--ink-deep);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--fg);
  }

  .notice {
    position: absolute;
    inset: 24px;
    display: none;
    padding: 20px;
    background: var(--ink-raised);
    border: 1px solid var(--rule);
    border-left: 2px solid #b4433a;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    color: #ffd8d3;
    white-space: pre-wrap;
    overflow: auto;
  }
  .notice.is-open { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <span class="mark" id="repo-title">Architecture</span>

    <div class="menu">
      <button class="btn menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false">
        <span id="menu-label">Diagrams</span><span class="caret">&#9660;</span>
      </button>
      <ul class="menu-list" id="menu-list" role="menu"></ul>
    </div>

    <span class="subtitle" id="subtitle">Loading&hellip;</span>

    <div class="actions">
      <button class="btn btn-primary" id="open-btn">Open .mmd</button>
    </div>
    <input type="file" id="file-input" accept=".mmd,.mermaid,.txt,.md" hidden>
  </header>

  <main class="stage" id="stage" tabindex="0" aria-label="Diagram canvas, drag to pan, scroll to zoom">
    <div class="controls">
      <button class="ctl" id="zoom-in"  title="Zoom in (+)"       aria-label="Zoom in">+</button>
      <button class="ctl" id="zoom-out" title="Zoom out (-)"      aria-label="Zoom out">&minus;</button>
      <button class="ctl" id="fit"      title="Fit to screen (0)" aria-label="Fit to screen">&#10530;</button>
      <button class="ctl" id="full"     title="Fullscreen (F)"    aria-label="Fullscreen">&#9974;</button>
    </div>

    <aside class="inspector" id="inspector">
      <div class="inspector-eyebrow" id="inspector-eyebrow">Component</div>
      <div class="inspector-title" id="inspector-title"></div>
      <p class="inspector-body" id="inspector-body"></p>
      <a class="inspector-path" id="inspector-path" target="_blank" rel="noopener"></a>
    </aside>

    <div class="notice" id="notice"></div>
  </main>

  <footer class="statusbar">
    <span><b>Zoom</b> <span class="readout" id="zoom-readout">100%</span></span>
    <span><b>Origin</b> <span class="readout" id="pan-readout">0, 0</span></span>
    <span><b>Selected</b> <span class="readout" id="sel-readout">&mdash;</span></span>
    <span class="hint">
      Drag to pan &middot; scroll or double-click to zoom &middot;
      <kbd>+</kbd> <kbd>&minus;</kbd> <kbd>0</kbd> <kbd>F</kbd> &middot; click a node
    </span>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/panzoom@9.4.4/dist/panzoom.min.js"></script>

<script>
(function () {
  "use strict";

  var SVG_NS = "http://www.w3.org/2000/svg";
  var GRID   = 24;
  var MANIFEST_URL = "diagrams/manifest.json";

  // Namespaced by path: every repo on a user's github.io shares one origin, so an
  // unnamespaced key would have them overwriting each other. Trailing "index.html"
  // is stripped so /repo/ and /repo/index.html are the same page as far as state
  // is concerned.
  var STORE_KEY = "diagram-viewer:" + location.pathname.replace(/index\.html$/, "");

  var stage       = document.getElementById("stage");
  var noticeEl    = document.getElementById("notice");
  var zoomReadout = document.getElementById("zoom-readout");
  var panReadout  = document.getElementById("pan-readout");
  var selReadout  = document.getElementById("sel-readout");
  var inspector   = document.getElementById("inspector");
  var inspEyebrow = document.getElementById("inspector-eyebrow");
  var inspTitle   = document.getElementById("inspector-title");
  var inspBody    = document.getElementById("inspector-body");
  var inspPath    = document.getElementById("inspector-path");
  var subtitleEl  = document.getElementById("subtitle");
  var titleEl     = document.getElementById("repo-title");
  var fileInput   = document.getElementById("file-input");
  var menuBtn     = document.getElementById("menu-btn");
  var menuList    = document.getElementById("menu-list");
  var menuLabel   = document.getElementById("menu-label");

  var manifest = { diagrams: [], nodes: {} };
  var currentId = null;
  var source = "";
  var pz = null;
  var renderCount = 0;
  var restoring = false;
  var saveTimer = null;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- persistence ---------- */

  function readStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }

  function writeStore(state) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { /* private mode or quota: carry on without persistence */ }
  }

  function rememberDiagram(id) {
    var s = readStore();
    s.current = id;
    writeStore(s);
  }

  function rememberView() {
    if (!pz || restoring || !currentId) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (!pz) return;
      var t = pz.getTransform();
      var s = readStore();
      s.views = s.views || {};
      s.views[currentId] = { x: t.x, y: t.y, scale: t.scale };
      writeStore(s);
    }, 250);
  }

  function restoreView() {
    if (!pz || !currentId) return;
    var view = (readStore().views || {})[currentId];
    if (!view) return;
    restoring = true;
    pz.zoomAbs(0, 0, view.scale);
    pz.moveTo(view.x, view.y);
    restoring = false;
    readout();
  }

  /* ---------- mermaid ---------- */

  mermaid.initialize({
    startOnLoad: false,
    securityLevel: "loose",
    theme: "base",
    flowchart: { useMaxWidth: false, htmlLabels: true, curve: "basis", padding: 16 },
    themeVariables: {
      background:          "#f4f6f9",
      primaryColor:        "#ffffff",
      primaryTextColor:    "#1b2030",
      primaryBorderColor:  "#46506a",
      lineColor:           "#6b7688",
      secondaryColor:      "#ffffff",
      tertiaryColor:       "#e9edf4",
      clusterBkg:          "#e9edf4",
      clusterBorder:       "#c7d0de",
      edgeLabelBackground: "#f4f6f9",
      fontSize:            "14px"
    }
  });

  /* ---------- boot ---------- */

  fetch(MANIFEST_URL)
    .then(function (r) {
      if (!r.ok) throw new Error(MANIFEST_URL + " returned " + r.status);
      return r.json();
    })
    .then(function (data) {
      manifest = data;
      manifest.diagrams = manifest.diagrams || [];
      manifest.nodes = manifest.nodes || {};
      titleEl.textContent = manifest.title || "Architecture";
      document.title = (manifest.title || "Architecture") + " diagrams";
      buildMenu();

      // A link with a hash wins; otherwise pick up where this browser left off.
      var wanted = location.hash.replace("#", "") || readStore().current;
      var entry = byId(wanted) || manifest.diagrams[0];
      if (entry) selectDiagram(entry.id);
      else fail("The manifest lists no diagrams.\n\nRun /diagrams:create to add one.");
    })
    .catch(function (err) {
      fail(
        "Could not load " + MANIFEST_URL + ".\n\n" + err.message + "\n\n" +
        "A page opened straight from disk cannot fetch sibling files - browsers treat each\n" +
        "local file as its own origin. Serve the folder instead:\n\n" +
        "    cd docs && python3 -m http.server 8000\n\n" +
        "then open http://localhost:8000/\n\n" +
        "On GitHub Pages this works with no extra steps. You can also use Open .mmd to\n" +
        "load a single diagram by hand."
      );
    });

  function byId(id) {
    if (!id) return null;
    return manifest.diagrams.filter(function (d) { return d.id === id; })[0] || null;
  }

  function fail(message) {
    noticeEl.textContent = message;
    noticeEl.classList.add("is-open");
    subtitleEl.textContent = "No diagram loaded";
  }

  /* ---------- diagram menu ---------- */

  function buildMenu() {
    menuList.innerHTML = "";
    manifest.diagrams.forEach(function (d) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.className = "menu-item";
      b.dataset.id = d.id;
      b.setAttribute("role", "menuitem");

      var t = document.createElement("div");
      t.className = "menu-item-title";
      t.textContent = d.title || d.id;
      b.appendChild(t);

      if (d.description) {
        var p = document.createElement("div");
        p.className = "menu-item-desc";
        p.textContent = d.description;
        b.appendChild(p);
      }

      b.addEventListener("click", function () {
        selectDiagram(d.id);
        closeMenu();
      });

      li.appendChild(b);
      menuList.appendChild(li);
    });
  }

  function openMenu() {
    menuList.classList.add("is-open");
    menuBtn.setAttribute("aria-expanded", "true");
  }

  function closeMenu() {
    menuList.classList.remove("is-open");
    menuBtn.setAttribute("aria-expanded", "false");
  }

  menuBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (menuList.classList.contains("is-open")) closeMenu();
    else openMenu();
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".menu")) closeMenu();
  });

  /* ---------- diagram selection ---------- */

  function selectDiagram(id) {
    var entry = byId(id);
    if (!entry) return;

    currentId = id;
    rememberDiagram(id);
    history.replaceState(null, "", "#" + id);

    menuLabel.textContent = entry.title || entry.id;
    subtitleEl.textContent = entry.description || entry.file;
    Array.prototype.forEach.call(menuList.querySelectorAll(".menu-item"), function (b) {
      b.classList.toggle("is-current", b.dataset.id === id);
    });

    fetch("diagrams/" + entry.file)
      .then(function (r) {
        if (!r.ok) throw new Error(entry.file + " returned " + r.status);
        return r.text();
      })
      .then(function (text) { source = text.trim(); render(source, true); })
      .catch(function (err) { fail("Could not load " + entry.file + ".\n\n" + err.message); });
  }

  /* ---------- render ---------- */

  function render(code, restore) {
    noticeEl.classList.remove("is-open");
    closeInspector();

    mermaid.render("mmd-" + (++renderCount), code)
      .then(function (result) {
        var old = stage.querySelector("svg");
        if (old) old.remove();

        var holder = document.createElement("div");
        holder.innerHTML = result.svg;
        var svg = holder.querySelector("svg");
        stage.insertBefore(svg, stage.firstChild);

        if (result.bindFunctions) result.bindFunctions(stage);
        attachViewport(svg);
        if (restore) restoreView();
      })
      .catch(function (err) {
        fail("Mermaid could not parse this diagram.\n\n" + (err && err.message ? err.message : err));
      });
  }

  /* ---------- pan / zoom ---------- */

  function attachViewport(svg) {
    // Mermaid caps the SVG with an inline max-width, which stops it filling the
    // container. Strip it and let the viewBox handle the initial fit.
    svg.removeAttribute("width");
    svg.removeAttribute("height");
    svg.style.maxWidth = "none";
    svg.style.width = "100%";
    svg.style.height = "100%";
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    // panzoom transforms one group. Wrapping up front also avoids a slow first paint.
    var scene = document.createElementNS(SVG_NS, "g");
    scene.setAttribute("id", "scene");
    while (svg.firstChild) scene.appendChild(svg.firstChild);
    svg.appendChild(scene);

    if (pz) pz.dispose();
    pz = panzoom(scene, {
      maxZoom: 12,
      minZoom: 0.15,
      smoothScroll: false,
      zoomDoubleClickSpeed: 1.9,
      // panzoom binds arrow keys and +/- by default, which would double up with
      // this file's own keydown handler. Returning truthy suppresses its handling.
      filterKey: function () { return true; }
    });
    pz.on("transform", function () { readout(); rememberView(); });
    readout();
  }

  function readout() {
    if (!pz) return;
    var t = pz.getTransform();
    zoomReadout.textContent = Math.round(t.scale * 100) + "%";
    panReadout.textContent = Math.round(t.x) + ", " + Math.round(t.y);

    var step = GRID * t.scale;
    stage.style.backgroundSize = step + "px " + step + "px";
    stage.style.backgroundPosition = (t.x % step) + "px " + (t.y % step) + "px";
  }

  function centre() {
    var r = stage.getBoundingClientRect();
    return { x: r.width / 2, y: r.height / 2 };
  }

  function zoomBy(ratio) {
    if (!pz) return;
    var c = centre();
    if (reduceMotion) pz.zoomTo(c.x, c.y, ratio);
    else pz.smoothZoom(c.x, c.y, ratio);
  }

  function fit() {
    if (!pz) return;
    pz.moveTo(0, 0);
    pz.zoomAbs(0, 0, 1);
    readout();
    rememberView();
  }

  /* ---------- node inspection ---------- */

  function baseId(el) {
    var raw = el.id || "";
    var m = raw.match(/^flowchart-(.+?)-\d+$/);
    return m ? m[1] : raw;
  }

  function openInspector(node) {
    var prev = stage.querySelector("g.node.is-selected");
    if (prev) prev.classList.remove("is-selected");
    node.classList.add("is-selected");

    var id = baseId(node);
    var meta = manifest.nodes[id] || {};
    var label = meta.label || (node.textContent || "").trim() || id;

    inspEyebrow.textContent = meta.kind || "Component";
    inspTitle.textContent = label;
    inspBody.textContent = meta.note || "No description recorded for this component.";

    if (meta.path && manifest.repo) {
      inspPath.textContent = meta.path;
      inspPath.href = manifest.repo.replace(/\/$/, "") + "/" + meta.path;
      inspPath.style.display = "inline-block";
    } else {
      inspPath.style.display = "none";
      if (meta.path) inspBody.textContent += "  (" + meta.path + ")";
    }

    inspector.classList.add("is-open");
    selReadout.textContent = id || "-";
  }

  function closeInspector() {
    var prev = stage.querySelector("g.node.is-selected");
    if (prev) prev.classList.remove("is-selected");
    inspector.classList.remove("is-open");
    selReadout.textContent = "-";
  }

  stage.addEventListener("click", function (e) {
    var node = e.target.closest ? e.target.closest("g.node") : null;
    if (node) openInspector(node);
    else if (!e.target.closest(".inspector, .controls")) closeInspector();
  });

  /* ---------- manual file loading ---------- */

  function load(file) {
    var reader = new FileReader();
    reader.onload = function () {
      source = String(reader.result).trim();
      currentId = null;               // an ad-hoc file has no saved view
      subtitleEl.textContent = file.name;
      menuLabel.textContent = "Diagrams";
      Array.prototype.forEach.call(menuList.querySelectorAll(".menu-item"), function (b) {
        b.classList.remove("is-current");
      });
      render(source, false);
    };
    reader.readAsText(file);
  }

  document.getElementById("open-btn").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function (e) { if (e.target.files[0]) load(e.target.files[0]); });

  stage.addEventListener("dragover", function (e) { e.preventDefault(); stage.classList.add("dropping"); });
  stage.addEventListener("dragleave", function () { stage.classList.remove("dropping"); });
  stage.addEventListener("drop", function (e) {
    e.preventDefault();
    stage.classList.remove("dropping");
    if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
  });

  /* ---------- controls ---------- */

  document.getElementById("zoom-in").addEventListener("click", function () { zoomBy(1.4); });
  document.getElementById("zoom-out").addEventListener("click", function () { zoomBy(1 / 1.4); });
  document.getElementById("fit").addEventListener("click", fit);
  document.getElementById("full").addEventListener("click", function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen();
  });

  window.addEventListener("keydown", function (e) {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "+" || e.key === "=") { zoomBy(1.4); e.preventDefault(); }
    else if (e.key === "-" || e.key === "_") { zoomBy(1 / 1.4); e.preventDefault(); }
    else if (e.key === "0") { fit(); e.preventDefault(); }
    else if (e.key === "f" || e.key === "F") { document.getElementById("full").click(); }
    else if (e.key === "Escape") { closeInspector(); closeMenu(); }
  });

  window.addEventListener("resize", readout);
})();
</script>

</body>
</html>
